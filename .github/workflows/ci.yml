name: CI

on:
  push:
    branches: [ main, uplink/deploy-branch ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reddit_cluster_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify dependencies
        working-directory: ./backend
        run: |
          go mod verify
          go mod download

      - name: Run go vet
        working-directory: ./backend
        run: go vet ./...

      - name: Check for Go vulnerabilities
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/reddit_cluster_test?sslmode=disable
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend
          name: backend-coverage
        continue-on-error: true

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter
        working-directory: ./frontend
        run: npm run lint

      - name: Check for npm vulnerabilities
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
        continue-on-error: true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install chromium --with-deps

      - name: Run visual regression tests
        working-directory: ./frontend
        run: npm run test:visual

      - name: Run production-bundle interaction tests
        working-directory: ./frontend
        run: npm run test:e2e:production

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-visual-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-visual-results
          path: frontend/test-results/
          retention-days: 30

  build-backend-images:
    name: Build Backend Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend]

    strategy:
      matrix:
        component: [server, crawler, precalculate, migrate]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Docker file name
        id: dockerfile
        run: |
          if [ "${{ matrix.component }}" = "server" ]; then
            echo "file=Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "file=Dockerfile.${{ matrix.component }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build \
            --file "./backend/${{ steps.dockerfile.outputs.file }}" \
            --tag "reddit-cluster-${{ matrix.component }}:${{ github.sha }}" \
            --build-arg "VERSION=${{ github.ref_name }}" \
            --build-arg "COMMIT=${{ github.sha }}" \
            --build-arg "BUILD_TIME=${{ github.event.head_commit.timestamp }}" \
            ./backend

  build-frontend-image:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --file ./frontend/Dockerfile \
            --tag "reddit-cluster-frontend:${{ github.sha }}" \
            ./frontend
