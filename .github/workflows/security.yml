name: Security Scanning

on:
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan-backend:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run govulncheck
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Go mod verify
        working-directory: ./backend
        run: go mod verify

  dependency-scan-frontend:
    name: npm Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          # Run npm audit and fail on high or critical vulnerabilities
          npm audit --audit-level=high

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Dockerfile path
        id: dockerfile
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            echo "path=./backend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=./backend" >> "$GITHUB_OUTPUT"
          else
            echo "path=./frontend/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "context=./frontend" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image for scanning
        run: |
          docker build --pull \
            --file "${{ steps.dockerfile.outputs.path }}" \
            --tag "${{ matrix.component }}:scan" \
            "${{ steps.dockerfile.outputs.context }}"

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format table \
            "${{ matrix.component }}:scan"

  security-summary:
    name: Security Summary
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [dependency-scan-backend, dependency-scan-frontend, docker-security]
    if: always()

    steps:
      - name: Check job results
        run: |
          {
            echo "## Security Scan Results"
            echo ""
            echo "- Go Vulnerability Scan: ${{ needs.dependency-scan-backend.result }}"
            echo "- npm Vulnerability Scan: ${{ needs.dependency-scan-frontend.result }}"
            echo "- Docker Security: ${{ needs.docker-security.result }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Every declared scan must finish successfully.
          if [ "${{ needs.dependency-scan-backend.result }}" != "success" ] || \
             [ "${{ needs.dependency-scan-frontend.result }}" != "success" ] || \
             [ "${{ needs.docker-security.result }}" != "success" ]; then
            echo "❌ Security scan did not complete successfully" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ All security scans passed" >> "$GITHUB_STEP_SUMMARY"
          fi
