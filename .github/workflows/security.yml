name: Security Scanning

on:
  push:
    branches: [ main, uplink/deploy-branch ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-backend:
    name: Go Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run gosec
        working-directory: ./backend
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.10
          gosec -quiet \
            -include=G101,G102,G103,G106,G107,G201,G202,G203,G204,G301,G302,G303,G305,G401,G402,G403,G405,G406,G407,G501,G502,G503,G504,G505,G506,G601,G602 \
            ./...

  sast-frontend:
    name: Frontend Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run static checks
        working-directory: ./frontend
        run: |
          npm run lint
          npm run build

  dependency-scan-backend:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run govulncheck
        working-directory: ./backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Go mod verify
        working-directory: ./backend
        run: go mod verify

  dependency-scan-frontend:
    name: npm Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          # Run npm audit and fail on high or critical vulnerabilities
          npm audit --audit-level=high

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: false

      - name: Scan commit range with Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          gitleaks git --redact --log-opts="origin/${{ github.event.repository.default_branch }}..HEAD"

  docker-security:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Dockerfile path
        id: dockerfile
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            echo "path=./backend/Dockerfile" >> $GITHUB_OUTPUT
            echo "context=./backend" >> $GITHUB_OUTPUT
          else
            echo "path=./frontend/Dockerfile" >> $GITHUB_OUTPUT
            echo "context=./frontend" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image for scanning
        run: |
          docker build \
            --file "${{ steps.dockerfile.outputs.path }}" \
            --tag "${{ matrix.component }}:scan" \
            "${{ steps.dockerfile.outputs.context }}"

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --exit-code 1 \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --format table \
            "${{ matrix.component }}:scan"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast-backend, sast-frontend, dependency-scan-backend, dependency-scan-frontend, secret-scanning, docker-security]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Go Static Analysis: ${{ needs.sast-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Static Analysis: ${{ needs.sast-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Go Vulnerability Scan: ${{ needs.dependency-scan-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- npm Vulnerability Scan: ${{ needs.dependency-scan-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Security: ${{ needs.docker-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if any critical job failed
          if [ "${{ needs.sast-backend.result }}" = "failure" ] || \
             [ "${{ needs.sast-frontend.result }}" = "failure" ] || \
             [ "${{ needs.dependency-scan-backend.result }}" = "failure" ] || \
             [ "${{ needs.dependency-scan-frontend.result }}" = "failure" ] || \
             [ "${{ needs.secret-scanning.result }}" = "failure" ] || \
             [ "${{ needs.docker-security.result }}" = "failure" ]; then
            echo "❌ Security scan failed - critical vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All security scans passed" >> $GITHUB_STEP_SUMMARY
          fi
