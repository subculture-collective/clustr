services:
    api:
        container_name: reddit-cluster-api
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            migrate:
                condition: service_completed_successfully
        networks:
            web:
                aliases:
                    - reddit-api
        env_file:
            - ${CLUSTR_ENV_FILE:-.env}
        volumes:
            # Mount backups volume read-only to expose via HTTP endpoints
            - pgbackups:/app/backups:ro
        healthcheck:
            # Use jq to properly validate JSON structure instead of grep for '[' character
            # This ensures we get valid JSON with the expected status field, not just any response containing '['
            # Alternative: test: ["CMD", "curl", "-f", "http://localhost:8000/health"] (checks HTTP status only)
            test:
                [
                    'CMD',
                    'bash',
                    '-c',
                    'set -eo pipefail; curl -f http://localhost:8000/ready | jq -e ''.status == "ready"'' > /dev/null',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    crawler:
        container_name: reddit-cluster-crawler
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile.crawler
        depends_on:
            migrate:
                condition: service_completed_successfully
        networks:
            - web
        env_file:
            - ${CLUSTR_ENV_FILE:-.env}

    db:
        container_name: reddit-cluster-db
        image: postgres:17
        restart: unless-stopped
        environment:
            - POSTGRES_INITDB_ARGS=--data-checksums
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            # Mount the named volume at the default postgres data path
            - postgres_data:/var/lib/postgresql/data
        networks:
            - web
        env_file:
            - ${CLUSTR_ENV_FILE:-.env}
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 5s
            retries: 20
        command: postgres -c fsync=on -c synchronous_commit=on -c full_page_writes=on -c wal_level=replica

    migrate:
        container_name: reddit-cluster-migrate
        build:
            context: .
            dockerfile: Dockerfile.migrate
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - ${CLUSTR_ENV_FILE:-.env}
        networks:
            - web
        restart: 'no'

    precalculate:
        container_name: reddit-cluster-precalculate
        restart: unless-stopped
        # Production calculation runs on Kvant. This profile is retained only
        # for an explicit same-host rollback or development deployment.
        profiles: ['local-precalculate']
        build:
            context: .
            dockerfile: Dockerfile.precalculate
        command: ['/app/precalculate']
        depends_on:
            migrate:
                condition: service_completed_successfully
        env_file:
            - ${CLUSTR_ENV_FILE:-.env}
        networks:
            - web
        volumes:
            - ./scripts:/app/scripts
            # Persist backups on a named docker volume rather than a bind mount
            - pgbackups:/app/backups

    backup:
        container_name: reddit-cluster-backup
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile.precalculate
        command: ['/bin/sh', '-lc', '/app/scripts/backup-runner.sh']
        depends_on:
            migrate:
                condition: service_completed_successfully
        env_file:
            - ${CLUSTR_ENV_FILE:-.env}
        environment:
            - BACKUP_INTERVAL=24h
        networks:
            - web
        volumes:
            - ./scripts:/app/scripts:ro
            - pgbackups:/app/backups

    reddit_frontend:
        container_name: reddit-cluster-frontend
        restart: unless-stopped
        build:
            context: ../frontend
            dockerfile: Dockerfile
        depends_on:
            api:
                condition: service_healthy
        networks:
            web:
                aliases:
                    - reddit_frontend
        env_file:
            - ${CLUSTR_ENV_FILE:-.env}
        healthcheck:
            # Verify the public frontend path reaches the API's fail-closed
            # readiness contract, not merely that Nginx is serving assets.
            test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost/api/ready']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    prometheus:
        container_name: reddit-cluster-prometheus
        image: prom/prometheus:latest
        restart: unless-stopped
        volumes:
            - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ../monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
            - prometheus_data:/prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
        networks:
            - web
        ports:
            - '127.0.0.1:9090:9090'

    grafana:
        container_name: reddit-cluster-grafana
        image: grafana/grafana:latest
        restart: unless-stopped
        volumes:
            - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana_data:/var/lib/grafana
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_SERVER_ROOT_URL=http://localhost:3000
            - GF_AUTH_ANONYMOUS_ENABLED=false
        networks:
            - web
        ports:
            - '127.0.0.1:3000:3000'
        depends_on:
            - prometheus

volumes:
    postgres_data:
        name: reddit-cluster-postgres-data
    pgbackups:
        name: reddit-cluster-pgbackups
    prometheus_data:
        name: reddit-cluster-prometheus-data
    grafana_data:
        name: reddit-cluster-grafana-data

networks:
    web:
        external: true
