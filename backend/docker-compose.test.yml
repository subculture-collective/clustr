services:
    test-db:
        image: postgres:17
        environment:
            POSTGRES_USER: testuser
            POSTGRES_PASSWORD: testpass
            POSTGRES_DB: testdb
            POSTGRES_INITDB_ARGS: --data-checksums
        ports:
            - '127.0.0.1:5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U testuser -d testdb']
            interval: 5s
            timeout: 5s
            retries: 5

    test-migrate:
        build:
            context: .
            dockerfile: Dockerfile.migrate
        environment:
            DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb?sslmode=disable
        depends_on:
            test-db:
                condition: service_healthy
        restart: 'no'
